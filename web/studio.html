<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character studio</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<header>
  <a class="home" href="/">atc</a>
  <h1>Character studio</h1>
  <label>Character <select id="char"></select></label>
  <label>Room <select id="room"></select></label>
</header>
<main>
  <section id="stage">
    <div class="frame"><canvas id="live"></canvas></div>
    <div class="states" role="group" aria-label="Call state"></div>
    <div class="row">
      <button id="cycle" class="ghost">Run through the states</button>
      <button id="freeze" class="ghost" title="Hold every drawing on screen now">Freeze</button>
      <button id="release" class="ghost" hidden>Back to acting</button>
    </div>
    <div id="voicebox" class="voice" hidden>
      <select id="voice" aria-label="Voice"></select>
      <textarea id="line" rows="3" aria-label="What to say"></textarea>
      <div class="row"><button id="say">Say it</button><button id="talk" class="ghost" aria-pressed="false" title="Your voice: it listens, and hears you when you speak">Talk to it</button><span id="voicenote" class="note"></span></div>
    </div>
    <table class="now"><tbody></tbody></table>
  </section>
  <section id="detail">
    <nav class="tabs" role="tablist"></nav>
    <div id="pane"></div>
  </section>
</main>
<script type="module" src="studio.js"></script>
</body>
</html>
