<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; width: 640px; height: 640px; overflow: hidden; }
  body { display: grid; place-items: center; background: var(--a); color: #fff; font-family: system-ui, sans-serif; }
  svg { width: 58%; height: 58%; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  span { font-size: 330px; line-height: 1; }
  span.letter { font-size: 300px; font-weight: 600; }
</style>
</head>
<body>
<script type="module">
import { ICON_PATHS, appColor } from "./tile.js";
const q = new URLSearchParams(location.search);
const a = { name: q.get("name") || "", icon: q.get("icon") || "", color: q.get("color") || "" };
document.body.style.setProperty("--a", appColor(a));
if (ICON_PATHS[a.icon]) {
  document.body.innerHTML = `<svg viewBox="0 0 16 16">${ICON_PATHS[a.icon]}</svg>`;
} else {
  const s = document.createElement("span");
  s.textContent = a.icon || a.name.slice(0, 1).toUpperCase();
  if (!a.icon) s.className = "letter";
  document.body.append(s);
}
document.body.dataset.ready = "1";
</script>
</body>
</html>
