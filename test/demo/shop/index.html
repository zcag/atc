<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout: Fieldnote</title>
<style>
:root { --ink: #1d1a16; --dim: #6f675c; --line: #e6dfd3; --bg: #f8f5ef; --accent: #1f5d4c; --add: #1f7a4d; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
header { display: flex; justify-content: space-between; align-items: center; padding: 18px 40px; border-bottom: 1px solid var(--line); }
header b { font: 600 22px Georgia, serif; }
header span { color: var(--dim); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 40px; padding: 32px 40px; max-width: 1040px; margin: auto; }
h2 { margin: 0 0 14px; font: 600 20px Georgia, serif; }
.item { display: grid; grid-template-columns: 76px 1fr auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.swatch { width: 76px; height: 76px; border-radius: 6px; }
.item small { display: block; color: var(--dim); }
aside { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 22px; align-self: start; }
.row { display: flex; justify-content: space-between; padding: 6px 0; }
.row.off { color: var(--add); }
.row.total { font-size: 19px; font-weight: 600; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; }
.code { display: flex; gap: 8px; margin: 14px 0; }
.code input { flex: 1; padding: 10px 12px; border: 1px solid var(--accent); border-radius: 6px; font: inherit; letter-spacing: .06em; }
.code button { padding: 10px 14px; border: 1px solid var(--line); background: #fff; border-radius: 6px; font: inherit; }
.ok { color: var(--add); font-size: 13px; margin: -6px 0 10px; }
.pay { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; font: 600 16px system-ui, sans-serif; margin-top: 14px; }
</style></head>
<body>
<header><b>Fieldnote</b><span>Checkout, step 2 of 3</span></header>
<main>
<section><h2>Your order</h2>
<div class="item"><div class="swatch" style="background:linear-gradient(135deg,#c9a26b,#7c5a33)"></div><div>Waxed canvas notebook<small>A5, dotted</small></div><div>€24.00</div></div>
<div class="item"><div class="swatch" style="background:linear-gradient(135deg,#3d6b5c,#1d3a31)"></div><div>Brass pen<small>Fine nib, black ink</small></div><div>€38.50</div></div>
<div class="item"><div class="swatch" style="background:linear-gradient(135deg,#d8c7b0,#a58f73)"></div><div>Pocket refills<small>Pack of three</small></div><div>€11.00</div></div>
</section>
<aside><h2>Summary</h2>
<div class="row"><span>Goods</span><span>€73.50</span></div>
<div class="code"><input value="SPRING15" aria-label="Coupon code"><button>Applied</button></div>
<p class="ok">15% off goods. Shipping is paid in full.</p>
<div class="row off"><span>SPRING15</span><span>-€11.03</span></div>
<div class="row"><span>Shipping</span><span>€4.90</span></div>
<div class="row total"><span>Total</span><span>€67.37</span></div>
<button class="pay">Pay €67.37</button>
</aside>
</main>
</body></html>
